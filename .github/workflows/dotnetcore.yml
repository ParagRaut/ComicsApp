name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    env:
      # Required so nuget.config's %GITHUB_TOKEN% can authenticate to GitHub Packages.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Avoid NU3012 on Linux runners (Refit author-signature revocation check).
      NUGET_CERT_REVOCATION_MODE: offline

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Install dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration Release --no-restore
    - name: Test
      run: dotnet test --no-restore --verbosity normal
