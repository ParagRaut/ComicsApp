name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    env:
      # PAT with read:packages — reliably reads the ComicsProvider package across repos.
      # (The built-in GITHUB_TOKEN is blocked cross-repo for user-account packages: 403.)
      # Add this as an Actions secret in the repo settings.
      GITHUB_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
      # Avoid NU3012 on Linux runners (Refit author-signature revocation check).
      NUGET_CERT_REVOCATION_MODE: offline

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Install dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration Release --no-restore
    - name: Test
      run: dotnet test --no-restore --verbosity normal

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
    - name: Trigger Render deploy
      # Add the service's Deploy Hook URL as the RENDER_DEPLOY_HOOK_URL Actions secret.
      run: curl -fsSL -X POST "$RENDER_DEPLOY_HOOK_URL"
      env:
        RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

